<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spring WebSocket Chat</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        #chat-box { height: 300px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #f9f9f9; }
        .msg { margin: 5px 0; padding: 8px; border-radius: 4px; }
        .public { background-color: #e2f0d9; }
        .private { background-color: #ddebf7; border-left: 4px solid #2b78e4; }
        .system { color: gray; font-style: italic; font-size: 0.9em; }
        .controls { display: flex; gap: 10px; margin-bottom: 10px;}
        input[type="text"] { padding: 8px; flex: 1; }
        button { padding: 8px 16px; cursor: pointer; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
    <h2>WebSocket Chat</h2>
    <p>Logged in as: <strong id="username-display">Loading...</strong></p>
    
    <div id="chat-box"></div>

    <div class="controls">
        <select id="recipient">
            <option value="">Public (Everyone)</option>
            <option value="alice">Alice</option>
            <option value="bob">Bob</option>
            <option value="charlie">Charlie</option>
        </select>
    </div>
    <div class="controls">
        <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
